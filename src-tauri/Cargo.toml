[package]
name = "cockpit"
version = "1.0.2"
description = "Cockpit — centre de pilotage personnel"
edition = "2021"

# Application desktop uniquement : pas besoin des bibliothèques staticlib/cdylib destinées au mobile.
[lib]
name = "cockpit_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
